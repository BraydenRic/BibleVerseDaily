name: Preview

# Tests the code, validates every plan, then builds the preview page (upcoming posts rendered
# exactly as they will go out) and publishes it to GitHub Pages to check from a phone.
# Runs on content or code changes, after each post (started by Daily post), and manually.
on:
  push:
    branches: [main]
    paths: ["traditions/**", "accounts/**", "dailyverse/**", "assets/**", "tests/**", "requirements*.txt"]
  workflow_dispatch:
    inputs:
      videos:
        description: "How many upcoming posts get full videos"
        default: "3"
      stills:
        description: "How many upcoming posts to show (0 = all)"
        default: "14"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libfribidi0   # fribidi: Arabic/Devanagari shaping

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Validate plans
        run: python -m dailyverse validate

      - name: Render preview
        env:
          VIDEOS: ${{ inputs.videos || '3' }}
          STILLS: ${{ inputs.stills || '14' }}
        run: python -m dailyverse preview --videos "$VIDEOS" --stills "$STILLS"

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out/preview

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
